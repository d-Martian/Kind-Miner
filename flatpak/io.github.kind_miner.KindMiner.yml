app-id: io.github.kind_miner.KindMiner
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: kind-miner

finish-args:
  # Network access for mining traffic and Tor SOCKS at 127.0.0.1:9050
  - --share=network
  # Graphical display: Fyne's GLFW driver is built for X11 only (no
  # `-tags wayland`), so the app needs a real X11 socket — on Wayland sessions
  # that means XWayland. fallback-x11 would hide DISPLAY whenever Wayland is
  # present and crash the GUI (GLFW "NotInitialized" panic).
  # --share=ipc is needed for X11 MIT-SHM; --device=dri for OpenGL rendering.
  - --socket=x11
  - --share=ipc
  - --device=dri
  # D-Bus session bus — Fyne's system tray uses godbus for the status notifier
  - --socket=session-bus
  # Config: config.Dir() hardcodes ~/.config/kind-miner on Linux (it does not
  # consult XDG_CONFIG_HOME), so this grant is what lets the sandboxed app see
  # the same config as host builds (AppImage, go run). Do not remove it without
  # also changing config.Dir().
  - --filesystem=xdg-config/kind-miner:create
  # Downloaded binaries (xmrig/p2pool/tor) and p2pool state need no grant:
  # autoinstall.BinDir() follows XDG_DATA_HOME, which Flatpak points at the
  # app-private ~/.var/app/<app-id>/data.
  # System tray — covers both KDE and GNOME/freedesktop implementations
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar

build-options:
  env:
    - GOPATH=/run/build/kind-miner/gopath
    - GOFLAGS=-mod=vendor
    # The GUI needs cgo (Fyne's GLFW/OpenGL driver). The freedesktop SDK
    # provides the GL/X11/Wayland headers required to build it.
    - CGO_ENABLED=1

modules:
  - name: kind-miner
    buildsystem: simple
    build-commands:
      # Activate the Go SDK extension and build. The version is read from a
      # VERSION file that scripts/build-flatpak.sh drops in the source root
      # (flatpak-builder does not export FLATPAK_BRANCH into the build sandbox).
      # Falls back to "dev" when building this manifest directly.
      - |
        . /usr/lib/sdk/golang/enable.sh
        go build \
          -trimpath -buildvcs=false \
          -ldflags "-s -w -buildid= -X main.version=$(cat VERSION 2>/dev/null || echo dev)" \
          -o /app/bin/kind-miner \
          ./cmd/kind-miner
      # Desktop integration
      - install -Dm644 kind-miner.desktop
          /app/share/applications/io.github.kind_miner.KindMiner.desktop
      - sed -i 's/^Icon=.*/Icon=io.github.kind_miner.KindMiner/'
          /app/share/applications/io.github.kind_miner.KindMiner.desktop
      - install -Dm644 assets/icons/app-512.png
          /app/share/icons/hicolor/512x512/apps/io.github.kind_miner.KindMiner.png
      - install -Dm644 assets/icons/app-256.png
          /app/share/icons/hicolor/256x256/apps/io.github.kind_miner.KindMiner.png
      # AppStream metadata (required for Flathub; silences the build's
      # "No appstream data" warning and feeds software-center listings)
      - install -Dm644 io.github.kind_miner.KindMiner.metainfo.xml
          /app/share/metainfo/io.github.kind_miner.KindMiner.metainfo.xml
    sources:
      # Build from the current working tree. Go dependencies are vendored
      # (run `go mod vendor`) so the build needs no network — GOFLAGS above
      # selects -mod=vendor. skip keeps runtime data and build artifacts out of
      # the sandbox copy. For a Flathub submission use flathub/<this app-id>.yml,
      # which builds the reproducible vendored source tarball instead.
      - type: dir
        path: ..
        skip:
          - .git
          - .claude
          - build
          - dist
          - bin
          - p2pool.cache
          - p2pool.log
