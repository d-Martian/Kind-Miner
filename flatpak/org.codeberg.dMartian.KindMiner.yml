app-id: org.codeberg.dMartian.KindMiner
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: kind-miner

finish-args:
  # Network access for mining traffic and Tor SOCKS at 127.0.0.1:9050
  - --share=network
  # Graphical display for the Fyne window (Wayland preferred, X11 fallback).
  # --share=ipc is needed for X11 MIT-SHM; --device=dri for OpenGL rendering.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # D-Bus session bus — Fyne's system tray uses godbus for the status notifier
  - --socket=session-bus
  # Config file location (~/.config/kind-miner/)
  - --filesystem=xdg-config/kind-miner:create
  # Downloaded XMRig / p2pool binaries (~/.local/share/kind-miner/bin/)
  - --filesystem=xdg-data/kind-miner:create
  # System tray — covers both KDE and GNOME/freedesktop implementations
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar

build-options:
  env:
    - GOPATH=/run/build/kind-miner/gopath
    - GOFLAGS=-mod=vendor
    # The GUI needs cgo (Fyne's GLFW/OpenGL driver). The freedesktop SDK
    # provides the GL/X11/Wayland headers required to build it.
    - CGO_ENABLED=1

modules:
  - name: kind-miner
    buildsystem: simple
    build-commands:
      # Activate the Go SDK extension and build
      - |
        . /usr/lib/sdk/golang/enable.sh
        go build \
          -trimpath -buildvcs=false \
          -ldflags "-s -w -buildid= -X main.version=${FLATPAK_BRANCH:-dev}" \
          -o /app/bin/kind-miner \
          ./cmd/kind-miner
      # Desktop integration
      - install -Dm644 kind-miner.desktop
          /app/share/applications/org.codeberg.dMartian.KindMiner.desktop
      - sed -i 's/^Icon=.*/Icon=org.codeberg.dMartian.KindMiner/'
          /app/share/applications/org.codeberg.dMartian.KindMiner.desktop
      - install -Dm644 assets/icons/app.png
          /app/share/icons/hicolor/512x512/apps/org.codeberg.dMartian.KindMiner.png
      - install -Dm644 assets/icons/app.png
          /app/share/icons/hicolor/256x256/apps/org.codeberg.dMartian.KindMiner.png
    sources:
      # Build from the current working tree. Go dependencies are vendored
      # (run `go mod vendor`) so the build needs no network — GOFLAGS above
      # selects -mod=vendor. skip keeps runtime data and build artifacts out of
      # the sandbox copy. For a Flathub submission, swap this for a tagged git
      # source plus generated module sources (flatpak-go-vendor-generator).
      - type: dir
        path: ..
        skip:
          - .git
          - .claude
          - build
          - dist
          - bin
          - p2pool.cache
          - p2pool.log
