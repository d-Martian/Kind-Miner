# Adapt this template before copying it to .forgejo/workflows/ci.yml.
# Required Codeberg setup: enable repository Actions and attach/allow a runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: docker
    container:
      image: golang:1.25
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: go test ./...

  build:
    if: ${{ forge.ref == 'refs/heads/main' }}
    needs: test
    runs-on: docker
    container:
      image: golang:1.25
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: go build -trimpath -buildvcs=false -o build/app ./cmd/app

