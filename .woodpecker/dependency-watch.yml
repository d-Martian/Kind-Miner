# Codeberg Woodpecker CI — Stage 1 dependency watch (detect + notify, no AI).
#
# Polls upstream XMRig/P2Pool for new releases and, when one appears, opens a
# single tracking issue on this repo. It does NOT edit code or open a PR — the
# review/update/PR (Stage 2) is done by a human running the
# monero-miner-dependency-updater skill, so a person always vets a miner
# dependency before it ships.
#
# One-time setup:
#   1. Enable this repo on Codeberg Woodpecker (https://ci.codeberg.org/repos/add).
#   2. Create a Codeberg access token with scope `write:issue` and add it as a
#      Woodpecker repo secret named `codeberg_token`.
#   3. Add a cron named `miner_dependency_watch` (e.g. weekly) in the repo's
#      Woodpecker settings -> Crons.

when:
  - event: cron
    cron: miner_dependency_watch
  - event: manual

steps:
  - name: check-and-notify
    image: python:3.13-alpine
    environment:
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      # Detect: compares the pins in scripts/download-*.sh against the latest
      # upstream releases and writes dependency-update-report/latest.json.
      - python3 .claude/skills/monero-miner-dependency-updater/scripts/check_upstream_releases.py
          --report-dir dependency-update-report
      # Notify: opens/dedupes a Codeberg issue if an update is available.
      - python3 .claude/skills/monero-miner-dependency-updater/scripts/notify_codeberg_issue.py
          "$CI_REPO_OWNER" "$CI_REPO_NAME" dependency-update-report/latest.json
