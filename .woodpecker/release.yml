# Codeberg Woodpecker CI — Linux release artifacts on tag push.
#
# Codeberg's Forgejo Actions has no hosted runners and there is no macOS/Windows
# CI here, so this pipeline builds the Linux pieces only: the reproducible binary
# tarball and a self-integrating AppImage, with a combined SHA256SUMS, then
# drafts a Codeberg release for review. Flatpak is intentionally NOT built here —
# flatpak-builder needs container privileges Woodpecker doesn't grant; Flatpak is
# covered by flatpak/ (local dev manifest) and the Flathub submission instead.
#
# One-time setup:
#   1. Request Woodpecker access (https://codeberg.org/Codeberg-CI/requests) and
#      enable this repo at https://ci.codeberg.org/repos/add.
#   2. Create a Codeberg access token with scope `write:repository`
#      (Settings -> Applications) and add it as a Woodpecker repo secret named
#      `release_token`.
#   3. Tag a release: `git tag v0.2.0 && git push origin v0.2.0`.
#
# macOS/Windows builds need GitHub-hosted (or self-hosted) runners — see
# .github/workflows/release.yml, which is kept for that path.

when:
  - event: tag

steps:
  - name: linux-artifacts
    image: golang:1.25-bookworm
    environment:
      APPIMAGE_EXTRACT_AND_RUN: "1"   # let appimagetool run without FUSE
    commands:
      # cgo GUI deps (Fyne/GLFW + AppIndicator) and appimagetool
      - apt-get update
      - apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev libayatana-appindicator3-dev wget file ca-certificates
      - wget -qO /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
      - chmod +x /usr/local/bin/appimagetool
      # Build the AppImage (this also leaves the binary at build/kind-miner-linux-x86_64)
      - bash scripts/build-appimage.sh "$CI_COMMIT_TAG"
      # Reproducible binary tarball from that same binary
      - export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct 2>/dev/null || echo 0)"
      - mkdir -p dist
      - NAME="kind-miner-$CI_COMMIT_TAG-linux-amd64"
      - mkdir "$NAME"
      - cp build/kind-miner-linux-x86_64 "$NAME/kind-miner"
      - cp README.md config.example.yaml "$NAME/"
      # Normalized tar (sorted names, fixed mtime/uid/gid, gzip -n) so the
      # published archive is byte-identical across rebuilds, not just the binary.
      - tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner
          --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime
          -cf - "$NAME" | gzip -9 -n > "dist/$NAME.tar.gz"
      - mv kind-miner-*.AppImage dist/
      # Combined checksums (sign dist/SHA256SUMS with minisign once the key is
      # available as a secret — that is the published trust anchor).
      - cd dist && sha256sum kind-miner-*-linux-amd64.tar.gz kind-miner-*-linux-x86_64.AppImage > SHA256SUMS
      - cat dist/SHA256SUMS

  - name: release
    image: alpine:3
    depends_on:
      - linux-artifacts
    environment:
      RELEASE_TOKEN:
        from_secret: release_token
    commands:
      - apk add --no-cache curl jq
      - |
        api="https://codeberg.org/api/v1/repos/$CI_REPO/releases"
        rid=$(curl -fsS -X POST \
          -H "Authorization: token $RELEASE_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"tag_name\":\"$CI_COMMIT_TAG\",\"name\":\"$CI_COMMIT_TAG\",\"draft\":true}" \
          "$api" | jq -r .id)
        echo "drafted release id $rid"
        for f in dist/*; do
          echo "uploading $(basename "$f")"
          curl -fsS -X POST \
            -H "Authorization: token $RELEASE_TOKEN" \
            -F "attachment=@$f;type=application/octet-stream" \
            "$api/$rid/assets?name=$(basename "$f")" >/dev/null
        done
