name: Release

# Fires when you push a version tag: git tag v0.1.0 && git push --tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — ubuntu runner has the GTK/AppIndicator headers we need for CGo
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64

          # macOS Intel
          - runner: macos-13
            goos: darwin
            goarch: amd64

          # macOS Apple Silicon (native arm64 runner)
          - runner: macos-14
            goos: darwin
            goarch: arm64

          # Windows
          - runner: windows-latest
            goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the Makefile derives VERSION from `git describe` and
          # SOURCE_DATE_EPOCH from the commit time. A shallow clone has neither.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The GUI uses cgo: Fyne/GLFW needs the GL/X11/Wayland dev headers, and
      # the system tray needs the AppIndicator headers.
      - name: Install Linux build deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev \
            libayatana-appindicator3-dev

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          EXT=""
          [[ "${{ matrix.goos }}" == "windows" ]] && EXT=".exe"
          # Reproducible build flags — keep in sync with scripts/reproduce.sh
          # and REPRODUCIBLE.md.
          go build \
            -trimpath -buildvcs=false \
            -ldflags "-s -w -buildid= -X main.version=${GITHUB_REF_NAME}" \
            -o "kind-miner${EXT}" \
            ./cmd/kind-miner

      # macOS ships bsdtar as `tar`, which lacks the --sort/--mtime flags the
      # deterministic recipe needs. scripts/package.sh prefers gtar when present.
      - name: Install GNU tar (macOS)
        if: matrix.goos == 'darwin'
        run: brew install gnu-tar

      # Packaging goes through scripts/package.sh — the same recipe the Makefile
      # bundle-* targets use — so release archives are byte-reproducible and the
      # flags can't drift between local builds and CI. Windows runs it under bash
      # (Git Bash provides find/sort/zip); Compress-Archive has no way to pin
      # member mtimes and is not reproducible.
      - name: Package
        shell: bash
        run: |
          NAME="kind-miner-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          EXT=""
          [[ "${{ matrix.goos }}" == "windows" ]] && EXT=".exe"
          mkdir "$NAME"
          mv "kind-miner${EXT}" "$NAME/"
          cp README.md config.example.yaml "$NAME/"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            ASSET="${NAME}.zip"
            bash scripts/package.sh zip "$ASSET" . "$NAME"
          else
            ASSET="${NAME}.tar.gz"
            bash scripts/package.sh tar "$ASSET" . "$NAME"
          fi
          bash scripts/package.sh sha256 "$ASSET"
          echo "ASSET=$ASSET"             >> "$GITHUB_ENV"
          echo "CHECKSUM=$ASSET.sha256"   >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true                  # review before publishing
          generate_release_notes: true # auto-fills from commit messages
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}

  # ---------------------------------------------------------------------------
  # Linux desktop packages. Separate jobs (not the matrix above) because each
  # needs its own toolchain — appimagetool for one, flatpak-builder for the
  # other — and produces a single linux/amd64 artifact.
  # ---------------------------------------------------------------------------
  appimage:
    name: linux/amd64 AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Same cgo GUI deps as the matrix build job above.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev \
            libayatana-appindicator3-dev

      - name: Install appimagetool
        run: |
          wget -q -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Build AppImage
        # APPIMAGE_EXTRACT_AND_RUN lets appimagetool run without FUSE, which the
        # GitHub runner doesn't provide.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash scripts/build-appimage.sh "${GITHUB_REF_NAME}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            *.AppImage
            *.AppImage.sha256

  flatpak:
    name: linux/amd64 Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The Flatpak build runs offline in its sandbox, so Go modules must be
      # vendored on the host first (vendor/ is gitignored — see the manifest).
      - name: Vendor Go modules
        run: go mod vendor

      - name: Install flatpak-builder + runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          # Derive the runtime version from the manifest so the two can't drift.
          RTV=$(grep "^runtime-version:" flatpak/io.github.kind_miner.KindMiner.yml \
            | sed "s/.*'\(.*\)'.*/\1/")
          flatpak install --user -y flathub \
            "org.freedesktop.Platform//${RTV}" \
            "org.freedesktop.Sdk//${RTV}" \
            "org.freedesktop.Sdk.Extension.golang//${RTV}"

      - name: Build + bundle Flatpak
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --default-branch="${GITHUB_REF_NAME}" \
            --repo=repo build-dir \
            flatpak/io.github.kind_miner.KindMiner.yml
          BUNDLE="kind-miner-${GITHUB_REF_NAME}-linux-amd64.flatpak"
          flatpak build-bundle repo "$BUNDLE" \
            io.github.kind_miner.KindMiner "${GITHUB_REF_NAME}"
          sha256sum "$BUNDLE" > "${BUNDLE}.sha256"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            *.flatpak
            *.flatpak.sha256
