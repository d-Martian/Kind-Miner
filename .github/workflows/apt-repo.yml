name: apt repository

# Publishes the signed apt repository Nodos upgrade from, at
# https://d-martian.github.io/Kind-Miner/apt (fetched as tor+https), when a
# release is published — not when it is tagged. release.yml leaves releases
# as drafts for review, and this is what reaches every Nodo within a week,
# so it waits for that review.
#
# The repository holds the published release's .debs and nothing else: apt
# only ever wants the newest, and rollback on a Nodo is to engines kept on
# its own disk, not to an older package.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (defaults to the latest release)
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the release's .debs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir debs
          gh release download ${TAG:+"$TAG"} --pattern 'kind-minerd_*.deb' --pattern 'kind-minerd_*.deb.sha256' --dir debs
          (cd debs && sha256sum -c ./*.sha256)
          ls debs/*.deb

      - name: Import the signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          test -n "$APT_SIGNING_KEY" || { echo "APT_SIGNING_KEY is not set: run scripts/make-apt-key.sh"; exit 1; }
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          # The key that signs must be the key the .debs told apt to trust;
          # anything else is a repository no Nodo would accept.
          want="$(gpg --batch --with-colons --import-options show-only --import packaging/deb/kind-miner.asc | awk -F: '$1 == "fpr" { print $10; exit }')"
          have="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$want" && test "$want" = "$have" || { echo "signing key $have is not packaging/deb/kind-miner.asc ($want)"; exit 1; }

      - name: Build the repository
        run: |
          sudo apt-get install -y --no-install-recommends apt-utils
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          scripts/build-apt-repo.sh debs site/apt
          cp packaging/deb/kind-miner.asc site/apt/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
