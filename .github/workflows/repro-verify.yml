name: Reproducibility

# Builds the linux/amd64 release archive twice in the digest-pinned build
# container (scripts/release-gui-linux.sh, the recipe the release and a
# rebuilder both run), the second time from a copy of the tree at a
# different path, and fails if the two differ. The container fixes the C
# compiler, headers and Go toolchain; this is what catches anything else
# leaking in — a path, a timestamp, a stray vendor/ tree.
#
# Gated to push/PR/manual — never tags — so it can never block a release.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify-reproducible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure podman
        run: command -v podman || { sudo apt-get update && sudo apt-get install -y --no-install-recommends podman; }

      - name: Build twice from different paths and compare
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          scripts/release-gui-linux.sh ci "$RUNNER_TEMP/a" > /dev/null
          cp -r . "$RUNNER_TEMP/src-b"
          (cd "$RUNNER_TEMP/src-b" && scripts/release-gui-linux.sh ci "$RUNNER_TEMP/b" > /dev/null)
          a="$(cut -d' ' -f1 "$RUNNER_TEMP/a/kind-miner-ci-linux-amd64.tar.gz.sha256")"
          b="$(cut -d' ' -f1 "$RUNNER_TEMP/b/kind-miner-ci-linux-amd64.tar.gz.sha256")"
          echo "build A $a"
          echo "build B $b"
          test "$a" = "$b" || { echo "the linux release archive is NOT reproducible"; exit 1; }
