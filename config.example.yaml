# kind-miner configuration
# Copy to ~/.config/kind-miner/config.yaml and fill in your wallet address.

# Your Monero wallet address (required)
wallet: ""

# Connection mode: p2pool-remote | p2pool-local
#
#   p2pool-remote  Runs p2pool locally, connects to a remote monerod node.
#                  0% fee, trustless payouts, no local blockchain needed.
#                  Recommended for most users.
#
#   p2pool-local   Runs p2pool locally, connects to your own monerod node.
#                  Fully trustless and private. Requires ~180 GB disk space.
#                  On a Nodo this is detected automatically: p2pool follows
#                  the Nodo's own monerod with the ports and RPC login set in
#                  Nodo's UI, skips its own RandomX dataset (--no-randomx),
#                  and restarts itself when those settings change there.
#                  Kind Miner only reads Nodo's config; it never writes to it.
#
# The old "pool" mode (XMRig straight to a Stratum pool) has been removed: it
# told a pool operator your wallet address, paid them a fee, and connected
# outside Tor. A config that still says mode: pool is moved to p2pool-remote
# when it loads. For a slow machine, p2pool_chain: nano (below) is the answer
# pool mode used to be.
mode: p2pool-remote

# --- p2pool-remote / p2pool-local settings ---

# Remote monerod RPC URL (used when mode: p2pool-remote).
# Leave blank to choose automatically: a synced monerod on this machine if
# there is one (RPC on 127.0.0.1:18081, ZMQ on 18083 — start monerod with
# --zmq-pub tcp://127.0.0.1:18083), otherwise the kind-miner Nodo over Tor —
# switching to the local node, without a restart, once it is ready.
# Only .onion nodes go through Tor; any other node here is reached directly,
# because Tor would slow every block template for no privacy gain.
remote_node: ""

# P2Pool sidechain — "main", "mini" or "nano"; anything else is rejected at
# startup. New setups use nano; a config that leaves this blank or leaves it
# out keeps "mini", the default when such configs were written.
#
# The chains differ in how hard a share is to find. What matters is landing
# shares often enough to stay inside the payout window (six hours on main and
# mini, eighteen on nano, whose blocks come every 30s); a chain whose
# shares you rarely land pays almost nothing, and the symptom looks exactly
# like the miner being broken.
#
#   main   above roughly 50 kH/s
#   mini   a busier chain for desktops; the default before nano
#   nano   the default — its 18-hour window keeps even a laptop paid steadily
#
# The Connection tab tells you how often you are actually landing shares and
# whether a different chain would suit the machine better.
p2pool_chain: nano

# Start kind-miner automatically when you log in. Changing this from the
# settings window also creates or removes the login entry your OS uses (an XDG
# autostart file, a LaunchAgent, or a registry Run value). Editing it here only
# takes effect the next time the app starts.
run_at_startup: false

# How long the keyboard and mouse must be quiet before mining is allowed its
# full kindness ceiling (seconds). Until then it is held to the Ghost ceiling,
# so a machine you are sitting at never has most of it taken. Set to 0 to use
# the chosen kindness immediately, without waiting for you to step away.
idle_full_after_seconds: 300

# --- p2pool-local settings ---

# Set to true to have kind-miner start/stop monerod for you. Ignored on a Nodo,
# whose monerod is Nodo's own.
manage_monerod: false

# Path to the monerod binary. Leave blank to search PATH.
monerod_path: ""

# --- p2pool subprocess ---

# kind-miner manages the p2pool subprocess for you in p2pool-remote and
# p2pool-local modes. Set to false only if you run p2pool yourself.
manage_p2pool: true

# Path to the p2pool binary. Leave blank to use the bundled binary.
p2pool_path: ""

# --- Tor ---

# In p2pool-remote mode, traffic to the .onion node is routed over Tor. If no
# Tor is reachable at 127.0.0.1:9050, kind-miner starts and manages its own Tor
# process (no system service or root required). Set to false to require that a
# system Tor already be running.
manage_tor: true

# Path to the tor binary. Leave blank to use a bundled tor, then search PATH.
tor_path: ""

# --- XMRig settings ---

# Path to the xmrig binary. Leave blank to use the bundled binary.
xmrig_path: ""

# Maximum CPU threads to use for mining.
# 0 = auto: as many threads as RandomX can actually use, which is the smaller of
# the logical core count and (L3 cache / 2 MiB). Threads past what the cache
# holds make the machine hash *less*, so raising this above auto usually costs
# hashrate rather than buying it. Kindness and the duty cycle do the throttling;
# this is only the ceiling of raw capacity.
max_threads: 0

# --- Kindness ---

# How much of the machine the miner may take, and how fast it gets out of the
# way when you want it back.
#
# Each preset is a CPU ceiling that mining and everything else share. The miner
# only ever asks for what is left underneath it, so other work always has the
# rest of the machine reserved. Every preset gives ground quickly and takes it
# back slowly — the difference is how much ground there is.
#
#   ghost     up to  52% CPU  Only genuinely idle cycles. Payouts are slow.
#   polite    up to  78% CPU  The default, and the one most people keep.
#   balanced  up to  90% CPU  Shares evenly; you may feel a short lag.
#   full      up to 100% CPU  Fills the rest of the machine. Still yields to
#                             your apps. For computers you are not sitting at.
#
# This replaces the old throttle_sensitivity key. A config that still has one
# is migrated on load (high -> ghost, medium -> polite, low -> balanced) and
# the dead key is dropped the next time the file is written. The preset once
# named "greedy" is now "full"; the old name still loads and is rewritten.
kindness: polite

# Pause mining when running on battery power.
pause_on_battery: true

# Ease mining off as the CPU approaches temp_limit_celsius, instead of mining
# flat out and then hard-stopping at the limit. On by default: a machine that
# idles warm should hold a temperature, not oscillate between full speed and a
# dead stop. The last few degrees before the limit scale the miner down; only
# the limit itself stops it. Set false to mine full-tilt right up to the limit.
thermal_governor: true

# Mine only while the screen is locked. Off by default: most people want the
# machine earning whenever they are away from it, not only when they remembered
# to lock it. Has no effect where the session lock state cannot be read.
mine_only_when_locked: false

# Pause mining when CPU temperature exceeds this value (Celsius).
# Set to 0 to disable temperature-based throttling.
temp_limit_celsius: 95

# --- Mining on a Nodo ---

# Run as a guest on a Nodo, or any big.LITTLE board whose job is serving a
# Monero node. Off by default and never switched on automatically: the node is
# the machine's purpose, and mining on it is the owner's call. When on:
#
#   - The miner starts on the low-power cores (the RK3588's four A55s) and takes
#     the big cores only after monerod.service and monero-lws.service have gone
#     30 seconds without waiting for CPU. It hands them back the first time either
#     one does. Moving between clusters never restarts the miner.
#   - Mining stops while monerod reports it is still syncing.
#   - temp_limit_celsius is held at 70 or below, even if it is set to 0.
#   - RandomX uses fast mode only if 4 GiB is still free for the node's
#     database cache after the ~2 GB dataset. Otherwise it uses light mode,
#     which hashes slower.
#   - max_threads: 0 means one thread per core, so every core is reachable.
#
# Takes effect on restart.
mine_on_nodo: false

# --- Dashboard chart ---

# Display only; none of this changes how the miner behaves.
chart:
  # Shade the band above the kindness ceiling — the part of the machine mining
  # will not touch.
  shade_headroom: true
  # Tick the moments the miner gave CPU back.
  mark_backoff: true
  # Overlay CPU temperature on a 0–100 °C scale.
  draw_temperature: false
  # Fill the area under the miner's line.
  fill_miner: true
  # How much history the chart shows: 30, 60 or 120 seconds.
  window_seconds: 30

# Log level: debug | info | warn | error
log_level: info
